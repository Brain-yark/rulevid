version: '3.8'

services:
  # --- Unified Entry Point ---
  proxy:
    image: nginx:alpine
    container_name: svsm-proxy
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - lago-api

  db:
    image: postgres:15-alpine
    container_name: svsm-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: svsm
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Lago Services ---

  lago-api:
    build:
      context: ../lago-api
      dockerfile: Dockerfile
    container_name: lago-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=production
      - DATABASE_URL=postgresql://lago:password@lago-db:5432/lago_production
      - REDIS_URL=redis://lago-redis:6379/0
      - LAGO_RSA_PRIVATE_KEY=${LAGO_RSA_PRIVATE_KEY}
      - SECRET_KEY_BASE=${LAGO_SECRET_KEY_BASE}
      - LAGO_FRONT_URL=http://localhost:8080
      - LAGO_ENCRYPTION_PRIMARY_KEY=${LAGO_SECRET_KEY_BASE}
      - LAGO_ENCRYPTION_DETERMINISTIC_KEY=${JWT_SECRET}
      - LAGO_ENCRYPTION_KEY_DERIVATION_SALT=${JWT_SECRET}
    depends_on:
      - lago-db
      - lago-redis

  lago-worker:
    build:
      context: ../lago-api
      dockerfile: Dockerfile
    command: ["./scripts/start.worker.sh"]
    container_name: lago-worker
    restart: always
    environment:
      - RAILS_ENV=production
      - DATABASE_URL=postgresql://lago:password@lago-db:5432/lago_production
      - REDIS_URL=redis://lago-redis:6379/0
      - LAGO_RSA_PRIVATE_KEY=${LAGO_RSA_PRIVATE_KEY}
      - SECRET_KEY_BASE=${LAGO_SECRET_KEY_BASE}
      - LAGO_ENCRYPTION_PRIMARY_KEY=${LAGO_SECRET_KEY_BASE}
      - LAGO_ENCRYPTION_DETERMINISTIC_KEY=${JWT_SECRET}
      - LAGO_ENCRYPTION_KEY_DERIVATION_SALT=${JWT_SECRET}
    depends_on:
      - lago-db
      - lago-redis

  lago-db:
    image: postgres:15-alpine
    container_name: lago-db
    restart: always
    environment:
      POSTGRES_USER: lago
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lago_production
    ports:
      - '5434:5432'
    volumes:
      - lago_postgres_data:/var/lib/postgresql/data

  lago-redis:
    image: redis:7-alpine
    container_name: lago-redis
    restart: always

volumes:
  postgres_data:
  lago_postgres_data:
