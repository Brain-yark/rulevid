services:
  # PostgreSQL Database for SVSM
  db:
    image: postgres:15-alpine
    container_name: svsm-db
    restart: always
    environment:
      POSTGRES_USER: svsm_user
      POSTGRES_PASSWORD: svsm_password
      POSTGRES_DB: svsm_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svsm_user -d svsm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: svsm-backend
    restart: always
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      NODE_ENV: development
      DATABASE_URL: "postgresql://svsm_user:svsm_password@db:5432/svsm_db?schema=public"
      JWT_SECRET: "dev_jwt_secret_key_change_in_production"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
      AGORA_APP_ID: "${AGORA_APP_ID:-}"
      AGORA_APP_CERTIFICATE: "${AGORA_APP_CERTIFICATE:-}"
      AGORA_CUSTOMER_ID: "${AGORA_CUSTOMER_ID:-}"
      AGORA_CUSTOMER_CERTIFICATE: "${AGORA_CUSTOMER_CERTIFICATE:-}"
      AGORA_CHAT_APP_KEY: "${AGORA_CHAT_APP_KEY:-}"
      AGORA_CHAT_CLIENT_ID: "${AGORA_CHAT_CLIENT_ID:-}"
      AGORA_CHAT_CLIENT_SECRET: "${AGORA_CHAT_CLIENT_SECRET:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      LAGO_API_URL: "${LAGO_API_URL:-http://localhost:3000}"
      LAGO_API_KEY: "${LAGO_API_KEY:-}"
    depends_on:
      db:
        condition: service_healthy

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-}"
        VITE_AGORA_APP_ID: "${AGORA_APP_ID:-}"
        VITE_AGORA_CHAT_APP_KEY: "${AGORA_CHAT_APP_KEY:-}"
    container_name: svsm-frontend
    restart: always
    ports:
      - '5173:80'
      - '5174:443'
    volumes:
      - ./frontend/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend

volumes:
  postgres_data:
